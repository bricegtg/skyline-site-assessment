services:
  - type: web
    name: skyline-site-assessment
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skyline-site-assessment-db
          property: connectionString
      - key: CRM_BASE_URL
        value: https://skyline-drones-crm.onrender.com
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: VERSION
        value: 1.0.0
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 5
databases:
  - name: skyline-site-assessment-db
    plan: free
